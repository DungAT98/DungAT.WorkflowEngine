<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{BASE}}">
  <title>{{TITLE}}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 10h6v4H9zM17 18h6v4h-6zM15 12h4a2 2 0 0 1 2 2v4' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script>window.__WORKFLOW__ = {{CONFIG}};</script>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('wf-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script defer src="js/api.js"></script>
  <script defer src="js/format.js"></script>
  <script defer src="js/diagram.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/router.js"></script>
  <script defer src="js/pages/overview.js"></script>
  <script defer src="js/pages/definitions.js"></script>
  <script defer src="js/pages/definition.js"></script>
  <script defer src="js/pages/editor.js"></script>
  <script defer src="js/pages/instances.js"></script>
  <script defer src="js/pages/instance.js"></script>
  <script defer src="js/shell.js"></script>
  <script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="shell" x-cloak>
  <aside class="sidebar" :class="{ open: navOpen }">
    <a class="brand" href="#/">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 10h6v4H9zM17 18h6v4h-6zM15 12h4a2 2 0 0 1 2 2v4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name" x-text="title"></span>
    </a>
    <nav class="nav">
      <template x-for="item in nav" :key="item.key">
        <a :href="item.href" :class="{ active: $store.router.section === item.key }" @click="navOpen = false">
          <span class="nav-icon" x-html="item.icon"></span><span x-text="item.label"></span>
        </a>
      </template>
    </nav>
    <div class="sidebar-foot">
      <template x-if="$store.app.meta">
        <div class="who">
          <span class="avatar" x-text="initials"></span>
          <span class="who-text">
            <strong x-text="$store.app.meta.userId"></strong>
            <small x-text="$store.app.meta.readOnly ? 'Read-only mode' : roles"></small>
          </span>
        </div>
      </template>
      <button class="icon-btn" @click="toggleTheme()" :title="'Theme: ' + theme" aria-label="Toggle theme">
        <svg x-show="!isDark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg x-show="isDark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </aside>
  <div class="scrim" x-show="navOpen" @click="navOpen = false" x-transition.opacity></div>

  <header class="topbar">
    <button class="icon-btn" @click="navOpen = !navOpen" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <strong x-text="title"></strong>
  </header>

  <main id="view" class="content" tabindex="-1"></main>

  <div class="toasts" aria-live="polite">
    <template x-for="t in $store.ui.toasts" :key="t.id">
      <div class="toast" :class="t.kind" @click="$store.ui.dismiss(t.id)" x-transition>
        <span x-text="t.message"></span>
      </div>
    </template>
  </div>

  <div class="modal-backdrop" x-show="$store.ui.dialog" x-transition.opacity
       @click.self="$store.ui.close(null)" @keydown.escape.window="$store.ui.dialog && $store.ui.close(null)">
    <template x-if="$store.ui.dialog">
      <div class="modal" role="dialog" aria-modal="true">
        <h3 x-text="$store.ui.dialog?.title"></h3>
        <p class="muted" x-show="$store.ui.dialog?.message" x-text="$store.ui.dialog?.message"></p>
        <template x-if="$store.ui.dialog?.kind === 'prompt'">
          <label class="field">
            <span x-text="$store.ui.dialog?.label"></span>
            <textarea rows="3" x-model="$store.ui.promptValue" x-init="$nextTick(() => $el.focus())"
                      @keydown.ctrl.enter="$store.ui.submit()" @keydown.meta.enter="$store.ui.submit()"></textarea>
          </label>
        </template>
        <div class="modal-actions">
          <button class="btn" @click="$store.ui.close(null)">Cancel</button>
          <button class="btn" :class="$store.ui.dialog?.danger ? 'danger' : 'primary'" @click="$store.ui.submit()"
                  :disabled="$store.ui.dialog?.kind === 'prompt' && $store.ui.dialog?.required && !$store.ui.promptValue.trim()"
                  x-text="$store.ui.dialog?.confirmText"></button>
        </div>
      </div>
    </template>
  </div>
</body>
</html>
