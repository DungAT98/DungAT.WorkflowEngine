name: release

# Manually run from the Actions tab: enter a version (e.g. 1.2.0 or 1.3.0-beta.1).
# Builds, tests, packs, pushes to nuget.org (trusted publishing, no stored API key), then tags vX.Y.Z and creates the GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0 or 1.3.0-beta.1, no "v" prefix)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tag + create GitHub release
      id-token: write   # OIDC token for NuGet trusted publishing
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid SemVer version"; exit 1
          fi

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # MinVer needs tags

      - name: Ensure tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      # Local tag only; MinVer derives the package version from it. Pushed after NuGet succeeds.
      - name: Tag locally for MinVer
        env:
          VERSION: ${{ inputs.version }}
        run: git tag "v$VERSION"

      - run: dotnet build -c Debug
      - run: dotnet test -c Debug --no-build
      - run: dotnet pack -c Debug --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with: { name: packages, path: artifacts/* }

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived (1h) NuGet API key.
      # Requires a trusted publishing policy on nuget.org (owner DungAT98, repo DungAT.WorkflowEngine, workflow release.yml).
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, NOT email

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          flags=""
          [[ "$VERSION" == *-* ]] && flags="--prerelease"
          gh release create "v$VERSION" artifacts/* \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes $flags
